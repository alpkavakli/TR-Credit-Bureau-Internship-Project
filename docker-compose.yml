version: '3.8'
services:
 db:
   image: postgres:15-alpine
   environment:
     POSTGRES_DB: miniscore
     POSTGRES_USER: miniscore_user
     POSTGRES_PASSWORD: miniscore_pass
   ports:
     - '5432:5432'
   volumes:
     - pgdata:/var/lib/postgresql/data
 
 backend:
   build: ./backend
   ports:
     - '8080:8080'
   environment:
     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/miniscore
     SPRING_DATASOURCE_USERNAME: miniscore_user
     SPRING_DATASOURCE_PASSWORD: miniscore_pass
     JWT_SECRET: gizli-anahtar-en-az-256-bit-uzunlugunda-olmalidir
   depends_on:
     - db
 
volumes:
 pgdata: