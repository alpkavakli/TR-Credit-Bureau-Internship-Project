server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA (BrowserRouter): /dashboard, /admin gibi yollar sunucuda DOSYA degildir.
    # Nginx dosyayi bulamazsa index.html'e dusurur; yonlendirmeyi React Router yapar.
    # Bu satir olmadan sayfa yenilenince (F5) 404 alinir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
